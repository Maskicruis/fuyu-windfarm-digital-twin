<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扶余一号 · 数字孪生工作台</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#081723;color:#d5edf5;font-family:'Microsoft YaHei',sans-serif}header{height:58px;display:flex;align-items:center;gap:24px;padding:0 22px;border-bottom:1px solid #245064;background:linear-gradient(110deg,#0d3449,#101e2c)}.brand{display:flex;align-items:center;gap:12px;font-size:16px;white-space:nowrap}.mark{color:#7cdef1;font-size:25px}small{display:block;color:#719aae;font-size:9px;letter-spacing:2px;margin-top:3px}nav{display:flex;gap:8px;flex:1}button{font:inherit;font-size:12px;border:1px solid transparent;background:transparent;color:#94b7c7;padding:9px 18px;border-radius:6px;cursor:pointer}button:hover{color:#dcf9ff;background:#143c51}button.active{color:#b9f3ff;border-color:#266f87;background:#12465d}.badge{font-size:10px;color:#80b8c5;white-space:nowrap}iframe{display:block;border:0;width:100%;height:calc(100% - 58px);background:#091c29}</style>
<header><div class="brand"><span class="mark">◇</span><div><b>扶余一号 · 数字孪生</b><small>CONSTRUCTION WORKSPACE</small></div></div><nav aria-label="桌面工作区"><button data-page="frontend.html" class="active">展示大屏</button><button data-page="admin.html">控制后台</button><button data-page="plugin/widget.html">知识与智能体</button><button data-page="plugin/widget.html?settings=1">API 与解析设置</button><button data-page="plugin/integration-demo.html">组件接入演示</button></nav><span class="badge">V11 · 桌面版</span></header>
<iframe id="workspace" title="数字孪生工作区" src="frontend.html" allow="clipboard-write; fullscreen"></iframe>
<script>
const frame=document.getElementById('workspace');let channel='';
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;for(const n of document.querySelectorAll('nav button'))n.classList.toggle('active',n===b);const url=new URL(b.dataset.page,location.href);channel='';if(url.pathname==='/plugin/widget.html'){channel=crypto.randomUUID();url.searchParams.set('parentOrigin',location.origin);url.searchParams.set('channel',channel);}frame.src=url.href;});
window.addEventListener('message',event=>{const m=event.data;if(event.source!==frame.contentWindow||event.origin!==location.origin||!m||m.protocol!=='twin-knowledge/v1'||m.channel!==channel||!channel)return;if(m.type==='hello')frame.contentWindow.postMessage({protocol:'twin-knowledge/v1',channel,type:'host.init'},location.origin);else if(m.type==='close.request')document.querySelector('[data-page="frontend.html"]').click();});
</script></html>
