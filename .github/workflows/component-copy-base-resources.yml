name: Attach verified component base resources
on:
  workflow_dispatch:
    inputs:
      release_id:
        type: string
        required: true
        description: Draft component-v1.3.3 release ID
permissions:
  contents: write
concurrency:
  group: component-base-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Copy immutable resources and verify each SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/copy-component-base-resources.py --release-id "${{ inputs.release_id }}" --repository "${{ github.repository }}"
