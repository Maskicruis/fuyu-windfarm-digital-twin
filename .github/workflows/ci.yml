name: Validate digital twin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r 开发源码/requirements.txt
      - run: npm install --ignore-scripts
      - run: python scripts/test-backend.py
      - run: npm test
      - run: python 开发源码/build.py
      - run: npm ci --prefix specflow-component --omit=dev --ignore-scripts
      - run: npm test --prefix specflow-component
