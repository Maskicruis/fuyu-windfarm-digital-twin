<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>其他孪生系统接入示例</title><style>body{margin:0;background:#102532;color:#d9edf3;font:15px/1.8 Microsoft YaHei,sans-serif;padding:6vh 7vw}h1{font-size:26px;font-weight:500}p{color:#9bbac8;max-width:720px}button{padding:10px 16px;background:#15465a;color:#bce9f5;border:1px solid #39788b;border-radius:7px;margin-right:10px;cursor:pointer}.scene{min-height:40vh;background:linear-gradient(25deg,#21483f,#153146);border:1px solid #3e6874;border-radius:16px;padding:30px;margin:30px 0;max-width:900px}.object{font-size:40px;color:#70d2df}#event{font:13px/1.8 Consolas,monospace;white-space:pre-wrap;padding:16px;background:#071e2c;border-radius:8px;max-width:900px}</style><body><span>TWIN KNOWLEDGE COMPONENT · INTEGRATION DEMO</span><h1>把知识与对话接入你自己的数字孪生</h1><p>页面只负责场景与对象选择；右下角的浮动组件独立运行。资料解析、模型配置、问答历史和原文定位由组件负责。这里用示意对象演示宿主上下文传递，不代表实际设备位置。</p><div class="scene"><div class="object" id="selected">◇ A-01 综合设备</div><p>切换对象时，SDK 会传递当前项目、对象和位置上下文；组件会停止旧请求并切换对话上下文。</p><button id="object-a">选择 A-01</button><button id="object-b">选择 B-02</button><button id="settings">API 设置</button></div><pre id="event">等待组件连接…</pre><script src="/plugin/twin-knowledge-sdk.js"></script><script>
const log=document.getElementById('event');
const plugin=TwinKnowledge.mount({baseUrl:location.origin,label:'✦ 知识智能体',onReady(){log.textContent='组件已连接，可打开浮窗、导入资料和配置 API。';select('A-01');},onFocusRequest(target){log.textContent='收到明确点击产生的定位请求：\n'+JSON.stringify(target,null,2)+'\n宿主应校验 objectId 后调用自身场景引擎，不直接执行模型文本。';},onError(message){log.textContent=message;}});
function select(id){document.getElementById('selected').textContent='◇ '+id+' 综合设备';plugin.setContext({systemId:'demo-twin',projectId:'demo-project',scope:'ALL',unit:'ALL',object:{id,label:id+' 综合设备'},location:{zone:id==='A-01'?'A 区':'B 区'},module:'construction',summary:'宿主页面只提供已选择对象，不自动改变资料范围。'});}
document.getElementById('object-a').onclick=()=>select('A-01');document.getElementById('object-b').onclick=()=>select('B-02');document.getElementById('settings').onclick=()=>plugin.openSettings();
</script></body></html>
